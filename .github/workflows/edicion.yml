name: Generar edición de noticias

on:
  schedule:
    # 7:00 y 18:00 en Madrid. Se programan las dos horas UTC posibles
    # (verano UTC+2 / invierno UTC+1) y el script descarta la que no toca.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: edicion
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser requests anthropic

      - name: Generar edición
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORA_PROGRAMADA: ${{ github.event.schedule }}
        run: python generar.py

      - name: Publicar
        run: |
          git config user.name "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"
          git add noticias.json ediciones/ || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Edición $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
